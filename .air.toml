root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/countdown.exe ."
  bin = "./tmp/countdown.exe"
  full_bin = "./tmp/countdown.exe"
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp", "static"]
  delay = 500

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
